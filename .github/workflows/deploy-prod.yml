name: Deploy Frontend PROD to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build frontend DEV
        run: yarn build

      - name: Deploy to Firebase Hosting PROD
        run: npx firebase-tools deploy --only hosting:prod --project xapity-45d11 --token "${{ secrets.FIREBASE_TOKEN }}"